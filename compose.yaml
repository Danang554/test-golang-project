services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: test-golang-api
    ports:
      - "8080:8080"
    environment:
      - APP_HOST=0.0.0.0
      - APP_PORT=8080
      - DB_HOST=host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./database/migrations:/app/database/migrations
    restart: unless-stopped
